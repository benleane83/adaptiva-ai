name: Copilot Setup Steps

on:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download supplied images
        run: |
          mkdir heygen-images
          curl --fail --location https://github.com/user-attachments/assets/f4a295d3-3685-4d59-9f2a-97726ba89cd4 --output heygen-images/digital-assistant.png
          curl --fail --location https://github.com/user-attachments/assets/f412d2cd-e331-48c7-80b2-ce7f0727adfd --output heygen-images/ads-promo.png
          curl --fail --location https://github.com/user-attachments/assets/32a1ee98-382c-40ba-97df-599f6a454cfd --output heygen-images/tips-how-to.png
          curl --fail --location https://github.com/user-attachments/assets/314985ae-9b2f-4346-a83b-6de7c2f67bd5 --output heygen-images/expert-explainer.jpg

      - name: Upload supplied images
        uses: actions/upload-pages-artifact@v3
        with:
          path: heygen-images
